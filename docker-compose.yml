services:
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: pulse9
      POSTGRES_PASSWORD: pulse9_pswd
      POSTGRES_DB: pulse9_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse9"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: